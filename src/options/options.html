<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PokerNow Copilot — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <h1>PokerNow Copilot Settings</h1>

    <div class="field">
      <label for="api-key">OpenRouter API Key</label>
      <input type="password" id="api-key" placeholder="sk-or-v1-..." autocomplete="off" />
      <small>
        Get a free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>.
        Stored locally — never leaves your browser except to OpenRouter.
      </small>
    </div>

    <div class="field">
      <label for="model">AI Model</label>
      <select id="model"></select>
      <small>Free models cost nothing — Hermes-3 405B gives the best poker analysis.</small>
    </div>

    <!-- Auto-analyze lives in the side panel header (the "AUTO" button) so it can
         be flipped mid-session without leaving the table. -->
    <div class="field toggle-row">
      <label for="show-overlays">Show seat overlays</label>
      <input type="checkbox" id="show-overlays" />
    </div>

    <div class="field toggle-row">
      <label for="show-side-panel">Show side panel button</label>
      <input type="checkbox" id="show-side-panel" />
    </div>

    <div class="actions">
      <button id="btn-save">Save Settings</button>
      <span id="save-status"></span>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
